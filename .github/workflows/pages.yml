# Builds the site and publishes it to GitHub Pages: https://sussyswimmer.github.io/lang-digital-experience/
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/funny-gates-g6ew58]
    paths-ignore: ['ops/**', 'raw-assets/**', 'blender/**', 'effectcraft/**', 'photocraft/**', 'docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /lang-digital-experience/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
